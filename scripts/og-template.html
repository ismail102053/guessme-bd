<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#fff6e5;font-family:Inter,"DejaVu Sans",sans-serif;color:#1c1a2e;position:relative}
  .dots{position:absolute;inset:0;background-image:radial-gradient(circle at 14px 14px,rgba(28,26,46,.09) 3px,transparent 3.5px);background-size:36px 36px}
  .frame{position:absolute;inset:36px;border:8px solid #1c1a2e;border-radius:48px;background:#fff;box-shadow:14px 14px 0 #1c1a2e}
  .mark{position:absolute;left:96px;top:96px;width:150px;height:150px;border-radius:44px;background:#0b7a57;border:8px solid #1c1a2e;display:grid;place-items:center;color:#fff;font-size:110px;font-weight:900;transform:rotate(-7deg);box-shadow:8px 8px 0 #1c1a2e}
  .dot{position:absolute;left:206px;top:84px;width:56px;height:56px;border-radius:50%;background:#f03a52;border:7px solid #1c1a2e}
  h1{position:absolute;left:96px;top:300px;margin:0;font-size:124px;line-height:1;font-weight:900;letter-spacing:-4px}
  h1 span{color:#f03a52}
  .bar{position:absolute;left:96px;top:470px;width:560px;height:30px;border-radius:15px;background:repeating-linear-gradient(45deg,#0b7a57,#0b7a57 18px,#12a073 18px,#12a073 36px);border:6px solid #1c1a2e}
  .chip{position:absolute;right:96px;top:110px;background:#ffc83d;border:7px solid #1c1a2e;border-radius:999px;padding:14px 36px;font-size:54px;font-weight:900;transform:rotate(4deg);box-shadow:6px 6px 0 #1c1a2e}
  .q{position:absolute;right:96px;bottom:70px;font-size:240px;font-weight:900;color:#ffc83d;-webkit-text-stroke:10px #1c1a2e;line-height:1;transform:rotate(8deg)}
</style></head><body>
<div class="dots"></div><div class="frame"></div>
<div class="mark">?</div><div class="dot"></div>
<div class="chip">QUIZ CHALLENGE</div>
<h1>GuessMe <span>BD</span></h1>
<div class="bar"></div>
<div class="q">?</div>
</body></html>
